# Dockerized SG101 dev stack (Python 3.7 / Django 3.2).
#
# Five services by default:
#   web      - Django dev server (the site), published on http://localhost:8000
#   worker   - Celery worker (background tasks)
#   beat     - Celery beat (scheduled tasks)
#   postgres - PostgreSQL 16 (the site's database)
#   redis    - Redis (Celery broker + "who's online")
#
# Plus `db` (MySQL 5.7), which no longer starts on its own: it sits behind the
# `mysql` profile, because the only thing that still needs it is converting a
# production snapshot, which reads from MySQL and writes to Postgres -- and then
# verifying that conversion, since tools/pgloader/verify.py and verify_data.py
# compare both engines and default MYSQL_HOST to this service. Start it
# when you need it:
#     docker compose --profile mysql up
# Which engine the app talks to is the DB_ENGINE variable (see the `environment:`
# block on `web`); pointing it back at `mysql` needs that profile too.
#
# The web/worker/beat services each build from the SAME ./Dockerfile (as separate
# images) and bind-mount the repo, so editing code on the Mac is reflected live.
# Rebuild ALL of them with `docker compose build` (no service name) after changing
# the Dockerfile or requirements -- `build web` alone leaves worker/beat stale.
#
# Common commands (see DOCKER.md for the full walkthrough):
#   docker compose build          # build the Python 3.7 image
#   docker compose up             # start the whole stack
#   docker compose up -d          # ...in the background
#   docker compose logs -f web    # follow the web server logs
#   docker compose down           # stop and remove the containers
#
# Config/secrets note: SECRET_KEY, DB creds, and API keys come from the
# git-ignored .env file (see .env.example), loaded via `env_file:` below; base.py
# reads them from the environment. The DB/Redis topology (DB_ENGINE, REDIS_HOST,
# DJANGO_SETTINGS_MODULE) is set inline and consumed by sg101/settings/docker.py.

services:
  db:
    image: mysql:5.7
    # mysql:5.7 ships amd64 only; run it under emulation on Apple Silicon.
    platform: linux/amd64
    # Opt-in. The site runs on Postgres now, so this starts only for a snapshot
    # conversion and its verification (or to point the app back at MySQL):
    # `--profile mysql`. Keep it: the cutover converts a fresh snapshot, and
    # verifying that needs this service as the side to compare against.
    profiles:
      - mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: sg101
      MYSQL_USER: sg101
      MYSQL_PASSWORD: sg101
    command:
      # The production snapshot is utf8 (3-byte), dumped from MySQL 5.5.
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      # 5.5-style permissive sql_mode: MySQL 5.7 defaults to STRICT + NO_ZERO_DATE,
      # which rejects the 0000-00-00 dates the legacy 5.5 dump contains and which
      # the legacy app relies on. Empty = faithful to the old server.
      - --sql-mode=
    volumes:
      - db_data:/var/lib/mysql
      # Drop DB snapshots here (git-ignored); load them with the mysql CLI.
      # See DOCKER.md "Load the production snapshot".
      - ./snapshots:/snapshots:ro
    ports:
      # Exposed on the host so you can connect a GUI/CLI if you like.
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    # The site's database. 16 is the version the target architecture names, and
    # its support window (Nov 2028) outlasts every remaining rung of the Django
    # ladder: 3.2 needs 9.6+, 5.2 needs 14+, so one server version covers the
    # whole climb. Unlike mysql:5.7 this image has an arm64 build -- no
    # emulation on Apple Silicon.
    image: postgres:16
    environment:
      POSTGRES_DB: sg101
      POSTGRES_USER: sg101
      POSTGRES_PASSWORD: sg101
      # Explicit, because it's the point of the exercise: the cluster is UTF8,
      # so the 8 latin1 tables in the MySQL snapshot get transcoded on the way
      # in rather than carried over as mojibake.
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Same read-only snapshot mount as `db`, for the conversion.
      - ./snapshots:/snapshots:ro
    ports:
      # 5432 on the host, so you can point a GUI/CLI (or pgloader) at it.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sg101 -d sg101"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    # Docker-topology vars (not secrets): which settings module, which database
    # engine, and where the redis service lives on the Compose network.
    #
    # DB_ENGINE picks the database: `postgresql` (the default) or `mysql`, which
    # needs its service started as well:
    #     DB_ENGINE=mysql docker compose --profile mysql up
    # Host and port default to whichever service runs that engine, so this is
    # the only knob; DB_HOST/DB_PORT still override for anything off-Compose.
    environment: &app_env
      DJANGO_SETTINGS_MODULE: sg101.settings.docker
      DB_ENGINE: ${DB_ENGINE:-postgresql}
      REDIS_HOST: redis
    # Secrets + DB credentials (SECRET_KEY, DB_*, API keys) come from the
    # git-ignored .env file -- see .env.example. `environment:` above wins over
    # anything also set here, by design.
    env_file: &app_env_file
      - .env
    # Force sequential A/AAAA DNS lookups. Without this, resolving service names
    # (db, redis) triggers glibc's parallel IPv4+IPv6 query; Docker's embedded DNS
    # answers the A record but not the AAAA, so each lookup blocks the full 5s
    # resolver timeout -> a ~5s stall on EVERY request (fresh DB connect per req).
    dns_opt: &app_dns_opt
      - single-request-reopen
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    # `db` is deliberately absent: it lives behind the `mysql` profile, and a
    # dependency on it would drag it into every `up` and make the app wait for a
    # database it no longer uses.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A sg101 worker -l info
    environment: *app_env
    env_file: *app_env_file
    dns_opt: *app_dns_opt
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build: .
    command: celery -A sg101 beat -l info
    environment: *app_env
    env_file: *app_env_file
    dns_opt: *app_dns_opt
    volumes:
      - .:/app
    depends_on:
      - redis

volumes:
  db_data:
  postgres_data:
