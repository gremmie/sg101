# Dockerized SG101 dev stack (Python 3.7 / Django 1.11).
#
# Five services:
#   web    - Django dev server (the site), published on http://localhost:8000
#   worker - Celery worker (background tasks)
#   beat   - Celery beat (scheduled tasks)
#   db     - MySQL 5.7 (holds a production snapshot)
#   redis  - Redis (Celery broker + "who's online" + wiki cookies)
#
# The web/worker/beat services each build from the SAME ./Dockerfile (as separate
# images) and bind-mount the repo, so editing code on the Mac is reflected live.
# Rebuild ALL of them with `docker compose build` (no service name) after changing
# the Dockerfile or requirements -- `build web` alone leaves worker/beat stale.
#
# Common commands (see DOCKER.md for the full walkthrough):
#   docker compose build          # build the Python 3.7 image
#   docker compose up             # start the whole stack
#   docker compose up -d          # ...in the background
#   docker compose logs -f web    # follow the web server logs
#   docker compose down           # stop and remove the containers
#
# Config/secrets note: SECRET_KEY, DB creds, and API keys come from the
# git-ignored .env file (see .env.example), loaded via `env_file:` below; base.py
# reads them from the environment. The DB/Redis topology (DB_HOST, REDIS_HOST,
# DJANGO_SETTINGS_MODULE) is set inline and consumed by sg101/settings/docker.py.

services:
  db:
    image: mysql:5.7
    # mysql:5.7 ships amd64 only; run it under emulation on Apple Silicon.
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: sg101
      MYSQL_USER: sg101
      MYSQL_PASSWORD: sg101
    command:
      # The production snapshot is utf8 (3-byte), dumped from MySQL 5.5.
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      # 5.5-style permissive sql_mode: MySQL 5.7 defaults to STRICT + NO_ZERO_DATE,
      # which rejects the 0000-00-00 dates the legacy 5.5 dump contains and which
      # the legacy app relies on. Empty = faithful to the old server.
      - --sql-mode=
    volumes:
      - db_data:/var/lib/mysql
      # Drop DB snapshots here (git-ignored); load them with the mysql CLI.
      # See DOCKER.md "Load the production snapshot".
      - ./snapshots:/snapshots:ro
    ports:
      # Exposed on the host so you can connect a GUI/CLI if you like.
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    # Docker-topology vars (not secrets): which settings module and where the
    # db/redis services live on the Compose network.
    environment: &app_env
      DJANGO_SETTINGS_MODULE: sg101.settings.docker
      DB_HOST: db
      REDIS_HOST: redis
    # Secrets + DB credentials (SECRET_KEY, DB_*, API keys) come from the
    # git-ignored .env file -- see .env.example. `environment:` above wins over
    # anything also set here, by design.
    env_file: &app_env_file
      - .env
    # Force sequential A/AAAA DNS lookups. Without this, resolving service names
    # (db, redis) triggers glibc's parallel IPv4+IPv6 query; Docker's embedded DNS
    # answers the A record but not the AAAA, so each lookup blocks the full 5s
    # resolver timeout -> a ~5s stall on EVERY request (fresh DB connect per req).
    dns_opt: &app_dns_opt
      - single-request-reopen
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A sg101 worker -l info
    environment: *app_env
    env_file: *app_env_file
    dns_opt: *app_dns_opt
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build: .
    command: celery -A sg101 beat -l info
    environment: *app_env
    env_file: *app_env_file
    dns_opt: *app_dns_opt
    volumes:
      - .:/app
    depends_on:
      - redis

volumes:
  db_data:
