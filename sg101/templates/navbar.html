{% load messages_tags %}
<ul>
   {% if user.is_authenticated %}
   <li>Welcome, <a href="{% url 'bio-me' %}">{{ user.username }}</a></li>
   <li><a href="{% url 'forums-index' %}">Forums</a></li>
   <li>{% unread_messages %}</li>
   <li><a href="{% url 'search' %}">Search</a></li>
   <li><a href="{% url 'accounts-logout' %}">Logout</a></li>
   {% else %}
   <li>
   {% if request.path != "/accounts/logout/" %}
      <a id="login-link" href="{% url 'accounts-login' %}?next={{ request.path }}">Login</a>
   {% else %}
      <a id="login-link" href="{% url 'accounts-login' %}">Login</a>
   {% endif %}
   </li>
   <li><a href="{% url 'accounts-register' %}">Register</a></li>
   {% endif %}
</ul>
