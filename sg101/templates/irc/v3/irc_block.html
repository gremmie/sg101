<div class="callout">
   <div class="text-center">
      <h5><i class="fi-comment"></i> IRC Status <i class="fi-comment"></i></h5>
   </div>
   <ul>
      {% for nick in nicks %}
         <li>{{ nick }}</li>
      {% empty %}
         <li>Chatroom is empty</li>
      {% endfor %}
   </ul>
   <div class="text-center">
      {% if nicks %}
      <p>Join them in the <a href="irc://surfguitar101.com/ShallowEnd,needpass">#ShallowEnd</a>!</p>
      {% else %}
      <p><a href="irc://surfguitar101.com/ShallowEnd,needpass">Join #ShallowEnd</a></p>
      {% endif %}
      <p><a href="/irc/">Need help getting started?</a></p>
   </div>
</div>
