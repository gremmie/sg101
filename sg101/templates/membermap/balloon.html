{% load bio_tags %}
<div class="media-object">
   <div class="media-object-section">
      {% if avatar_url %}
         <a href="{% url 'bio-view_profile' username=user.name %}">
            <img src="{{ avatar_url }}" alt="{{ user.name }}" title="{{ user.name }}" class="thumbnail" /></a><br>
      {% endif %}
      {% profile_link user.name %}
   </div>
   <div class="media-object-section">
      {{ user.message|safe }}
   </div>
</div>
