{% extends 'v3/base.html' %}
{% load static %}
{% block custom_head %}
<link rel="alternate" type="application/rss+xml" title="SurfGuitar101 News" href="{% url 'feeds-news' %}" />
{% endblock %}
{% block content %}
<h2>SurfGuitar101 News &amp; Articles
   <a href="{% url 'feeds-news' %}" title="RSS Feed"><i class="fi-rss"></i></a></h2>

<div class="menu-centered">
   <ul class="vertical medium-horizontal menu">
      <li {% if section == 'main' %}class="active"{% endif %}>
         <a href="{% url 'news-index_page' %}">News Main</a></li>
      <li {% if section == 'archives' %}class="active"{% endif %}>
         <a href="{% url 'news-archive_index' %}">Archive</a></li>
      <li {% if section == 'categories' %}class="active"{% endif %}>
         <a href="{% url 'news-category_index' %}">Categories</a></li>
      <li {% if section == 'tags' %}class="active"{% endif %}>
         <a href="{% url 'news-tag_index' %}">Tags</a></li>
      <li {% if section == 'submit' %}class="active"{% endif %}>
         <a href="{% url 'news-submit' %}">Submit News</a></li>
   </ul>
</div>

{% block news_content %}
{% endblock %}
{% endblock %}
