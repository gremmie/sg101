{% load static %}
{% load bio_tags %}
<div>
<h4><a href="{{ link.url }}">{{ link.title }}</a></h4>
<p>{{ link.description }}</p>
<form action="{% url 'weblinks-visit' link.id %}" method="post">{% csrf_token %}
<ul>
   <li><strong>Added by:</strong> {% profile_link link.user.username %}</li>
   <li><strong>Category:</strong> <a href="{% url 'weblinks-view_links'
         slug=link.category.slug sort='date' %}">{{ link.category.title }}</a></li>
   <li><strong>Date Added:</strong> {{ link.date_added|date:"M d, Y" }}</li>
   <li><strong>Hits:</strong> {{ link.hits }}</li>
</ul>
<input type="submit" class="button" value="Visit Link" />
<a id="link-{{ link.id }}" class="alert button weblinks-broken" href="#">
   Report Broken Link</a>

</form>
</div>
<hr>
