<div class="side-block-v3">
   <div class="text-center">
      <h5><i class="fi-trophy"></i> Current Contests <i class="fi-trophy"></i></h5>
   </div>
   <ul>
      {% for contest in contests %}
      <li><a href="{{ contest.get_absolute_url }}">{{ contest.title }}</a></li>
      {% empty %}
      <li>No contests at this time. Check out our <a href="{% url 'contests-index' %}">past contests</a>.</li>
      {% endfor %}
   </ul>
</div>
