<div class="callout">
   <div class="text-center">
      <h5><i class="fi-graph-bar"></i> Current Polls <i class="fi-graph-bar"></i></h5>
   </div>
   <ul>
      {% for poll in polls %}
      <li><a href="{{ poll.get_absolute_url }}">{{ poll.question }}</a></li>
      {% empty %}
      <li>No polls at this time. Check out our <a href="{% url 'polls-main' %}">past polls</a></li>
      {% endfor %}
   </ul>
</div>
