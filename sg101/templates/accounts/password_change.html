{% extends 'v3/base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h2>Change Password</h2>
<form method="post" action=".">{% csrf_token %}
   {{ form.non_field_errors }}
   {{ form.old_password.errors }}
   <div class="row">
      <div class="medium-6 columns">
         <label for="{{ form.old_password.id_for_label }}">{{ form.old_password.label }}
            {{ form.old_password }}
         </label>
      </div>
   </div>
   {{ form.new_password1.errors }}
   <div class="row">
      <div class="medium-6 columns">
         <label for="{{ form.new_password1.id_for_label }}">{{ form.new_password1.label }}
            {{ form.new_password1 }}
         </label>
      </div>
   </div>
   {{ form.new_password2.errors }}
   <div class="row">
      <div class="medium-6 columns">
         <label for="{{ form.new_password2.id_for_label }}">{{ form.new_password2.label }}
            {{ form.new_password2 }}
         </label>
      </div>
   </div>
   <input type="submit" value="Change Password" class="primary button" />
   <a href="{% url 'bio-me' %}" class="secondary button">Cancel</a>
</form>
{% endblock %}
