{% load humanize %}
{% for bulletin in bulletins %}
<div class="row">
   <div class="columns">
      <div class="callout">
         <h3><i class="fi-megaphone"></i> {{ bulletin.title }}</h3>
         <div class="bulletin-text">
            {{ bulletin.text|safe }}
         </div>
         <p class="byline">
            Posted: {{ bulletin.start_date|naturalday|capfirst }}
            {{ bulletin.start_date|date:"H:i" }}.
         </p>
      </div>
   </div>
</div>
{% endfor %}
