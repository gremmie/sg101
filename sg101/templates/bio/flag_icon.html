{% if code != 'zz' %}
   {% if size == 'large' %}
      <div class="flag">
      <img src="{{ STATIC_URL }}flags/64/{{ code }}.png" alt="{{ name }}" title="{{ name }}" />
      {{ name }}
      </div>
   {% else %}
      <img src="{{ STATIC_URL }}flags/24/{{ code }}.png" alt="{{ name }}" title="{{ name }}" />
   {% endif %}
{% endif %}
