<h2 class="forum-nav"><a href="{% url 'forums-index' %}">SurfGuitar101 Forums</a> &raquo;

   {% if not forloop.last %}
      <a href="{{ nav_item.url }}">{{ nav_item.name }}</a> &raquo;

   {% endif %}
{% empty %}

{% endfor %}
