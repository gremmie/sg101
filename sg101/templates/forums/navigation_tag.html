<a class="intra" name="top"></a>
<nav aria-label="You are here:" role="navigation">
   <ul class="breadcrumbs">
      <li><a href="{% url 'forums-index' %}">SurfGuitar101 Forums</a></li>
      {% for nav_item in nav_list %}
         {% if not forloop.last %}
            <li><a href="{{ nav_item.url }}">{{ nav_item.name }}</a></li>
         {% else %}
            <li>
               <span class="show-for-sr">Current: </span>
               {% if nav_item.url %}
                  <a href="{{ nav_item.url }}">{{ nav_item.name }}</a>
               {% else %}
                  {{ nav_item.name }}
               {% endif %}
            </li>
         {% endif %}
      {% endfor %}
   </ul>
</nav>
