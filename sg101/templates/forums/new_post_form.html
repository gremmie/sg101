{% load core_tags forum_tags %}
<form action="." method="post">{% csrf_token %}
   <fieldset class="fieldset">
      <legend>Reply to Topic</legend>
      {{ form.non_field_errors }}
      {% post_box form.body video=True %}
      {{ form.topic_id }}
      <input type="submit" value="Reply" id="forums-reply-post"
         class="primary button" />
      <fieldset class="fieldset">
         <legend>Video Attachments</legend>
         {% post_attachments form %}
      </fieldset>
   </fieldset>
</form>
{% include 'core/v3/post_box_modals.html' with video=True %}
