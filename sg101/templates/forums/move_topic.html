{% extends 'base.html' %}
{% load forum_tags %}
{% block title %}Forums: Move Topic{% endblock %}
{% block content %}
{% forum_navigation topic "Move Topic" %}

<div class="forum-block">
<form action="." method="post">{% csrf_token %}
<fieldset>
<legend>Move Topic: {{ topic.name }}</legend>
   {{ form.as_p }}
   <input type="submit" value="Move Topic" />
</fieldset>
</form>
</div>
{% endblock %}
