# The registration form's honeypot, from Django's auth.log. Installed on the VM
# as /etc/fail2ban/filter.d/sg101-reg.conf.
#
# The line, from accounts/forms.py, with its UTC timestamp:
#   2026-09-29 22:30:00,008 CRITICAL Accounts/registration: Honeypot filled [198.51.100.7]

[Definition]

failregex = ^\s*CRITICAL Accounts/registration: Honeypot filled \[<HOST>\]

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S,%%f
