# Failed logins and registrations, from Django's auth.log. Installed on the VM
# as /etc/fail2ban/filter.d/sg101-auth.conf.
#
# The line, from antispam/decorators.py, with its UTC timestamp:
#   2026-09-29 22:30:00,008 ERROR Login failure from [198.51.100.7] for someuser
#
# Anchored at the level, which follows the timestamp: the username at the end
# is whatever the client typed, so an unanchored pattern could match an address
# written into it.

[Definition]

failregex = ^\s*ERROR (?:Login|Register) failure from \[<HOST>\]

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S,%%f
