# Ban at Cloudflare's edge: add the address to the account's IP list, which a
# WAF rule drops. Installed on the VM as
# /etc/fail2ban/action.d/cloudflare-block-list.conf.
#
# All the work is tools/cloudflare_block_list.py, which the blocklist-* Makefile
# targets also run, so the code that clears blocks by hand is the code fail2ban
# runs. It reads its token and the list's name from secrets/cloudflare.env in
# the checkout, and exits non-zero on any refusal, so fail2ban logs a failed
# ban or unban as failed -- including an unban of an address that is no longer
# on the list.
#
# A local ban would not work for the web ports: Docker forwards them before the
# host's INPUT chain, and every request arrives from Cloudflare anyway.

[Definition]

# Nothing to set up or tear down. Stopping fail2ban runs actionunban for every
# current ban, so the list holds none of its entries while it is stopped; its
# database restores them on start, and each is added again. Adding an address
# already listed leaves one item, with the new comment.
actionstart =
actionstop =
actioncheck =

actionban = <script> ban <ip>

actionunban = <script> unban <ip>

[Init]

script = /svr/sg101/tools/cloudflare_block_list.py

# Each call waits for Cloudflare's operation, up to 60 s, after looking the
# address up; fail2ban's own default would kill it at 60.
timeout = 120
