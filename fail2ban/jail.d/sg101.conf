# The site's jails, banning at Cloudflare. Installed on the VM as
# /etc/fail2ban/jail.d/sg101.conf, beside the package's defaults-debian.conf,
# which enables the sshd jail.
#
# Install only after the cutover runbook's real-client-IP check (B3) has passed:
# until auth.log records the client's own address, these would ban whatever
# address it records instead.
#
# auth.log is written in UTC, as the host's clock is; fail2ban reads the log's
# times as the host's. Rotation is logrotate's (logrotate/sg101), by rename,
# which fail2ban follows.
#
# The thresholds are the old host's.

[sg101-auth]
enabled  = true
filter   = sg101-auth
logpath  = /svr/sg101/var/log/django/auth.log
action   = cloudflare-block-list
maxretry = 6
findtime = 10m
bantime  = 10m

[sg101-reg]
enabled  = true
filter   = sg101-reg
logpath  = /svr/sg101/var/log/django/auth.log
action   = cloudflare-block-list
maxretry = 1
findtime = 10m
bantime  = 14d

# The package's own jail, enabled in defaults-debian.conf; this file sorts after
# it, so this setting wins. SSH is open to anywhere at the provider's firewall,
# and sshd is a host process, so a local ban works for it. 14 days is the old
# host's; the package default is 10 minutes.
[sshd]
bantime  = 14d
