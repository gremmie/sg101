# A heartbeat for the host's daily logrotate run, installed on the VM as
# /etc/systemd/system/logrotate.service.d/sg101-heartbeat.conf. See
# cutover-runbook.md B10.
#
# Why: the host has no mailer, so a logrotate failure reaches only the journal,
# and the logs grow until the disk fills. A directory logrotate thinks is
# insecure is skipped with exit 1; so is a failed postrotate, such as the
# Apache reload in logrotate/sg101. Both measured on the VM.
#
# The same pattern as the backup job: the heartbeat service is pinged at start,
# on success, and at /fail, and it alerts on a /fail or when a success is
# overdue. The overdue case covers what no hook here can report: the timer not
# firing, the machine being off. The Ubuntu timer is daily with up to an hour's
# random delay, so the check wants a period of 1 day and a grace of 2 hours.
#
# It reports on logrotate.service as a whole, so a failure in any
# /etc/logrotate.d file alerts, not only sg101's. That is deliberate: a host
# whose logs stop rotating is the problem, whoever's logs they are.
#
# The ping URL is in secrets/logrotate.env (git-ignored), one line:
#     HEARTBEAT_URL=https://hc-ping.com/<uuid>
# The leading "-" on each line below keeps logrotate running when that file is
# missing or a ping fails: a heartbeat that could stop the rotation it watches
# would be worse than none. With no URL the pings are skipped, and the service's
# overdue alarm is what notices.
#
# $$ passes a literal $ to sh; a single $ would be expanded by systemd first,
# and SERVICE_RESULT is not in its environment.

[Service]
EnvironmentFile=-/svr/sg101/secrets/logrotate.env
ExecStartPre=-/bin/sh -c '[ -z "$$HEARTBEAT_URL" ] || curl -fsS -m 10 --retry 3 -o /dev/null "$$HEARTBEAT_URL/start"'
ExecStopPost=-/bin/sh -c '[ -z "$$HEARTBEAT_URL" ] && exit 0; if [ "$$SERVICE_RESULT" = success ]; then s=; else s=/fail; fi; curl -fsS -m 10 --retry 3 -o /dev/null "$$HEARTBEAT_URL$$s"'
