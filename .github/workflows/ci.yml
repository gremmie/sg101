name: CI

# Runs the existing test suite on every push/PR to the modernization branch,
# using the SAME Docker image as local dev (Python 3.7 / Django 3.2) for parity.
# `main` intentionally has no CI: it's preserved legacy history and predates the
# Docker/CI setup, which live only on `modernize`.
on:
  push:
    branches: [modernize]
  pull_request:
    branches: [modernize]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # docker-compose loads .env via env_file, exactly like a fresh dev
      # checkout; seed it from the committed example (dummy SECRET_KEY + sqlite
      # means no real secrets are needed).
      - name: Seed .env from the example
        run: cp .env.example .env

      - name: Build the image (Py3.7 / Django 3.2)
        run: docker compose build web

      # Every app has migrations now, so this gate finally covers the whole
      # project. It used to be checking 5 apps out of 26 without saying so: a
      # blanket makemigrations skips apps that have no migrations package, and
      # 21 of them didn't, so their models could drift from the schema
      # unnoticed.
      - name: Check for missing migrations
        run: >
          docker compose run --rm web
          python manage.py makemigrations --check --dry-run
          --settings=sg101.settings.docker_test

      # docker_test settings: sqlite DB + Redis over TCP (the `redis` service is
      # started via depends_on). Measure coverage and print a summary.
      - name: Run test suite with coverage
        run: >
          docker compose run --rm web
          sh -c "coverage run --source='.' manage.py test --settings=sg101.settings.docker_test
          && coverage report
          && coverage xml"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v
