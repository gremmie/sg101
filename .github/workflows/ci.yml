name: CI

# Runs the existing test suite on every push/PR to the modernization branch,
# using the SAME Docker image and services as local dev (Python 3.12 /
# PostgreSQL 16) for parity -- the `postgres` service comes from
# docker-compose.yml rather than a GitHub-hosted service container, so CI and a
# developer's laptop run the identical database.
# `main` intentionally has no CI: it's preserved legacy history and predates the
# Docker/CI setup, which live only on `modernize`.
on:
  push:
    branches: [modernize]
  pull_request:
    branches: [modernize]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The v3 stylesheet is a committed build artifact, which buys one-step
      # deploys and a reviewable diff at the cost of someone having to remember
      # to rebuild. This is what collects that debt: rebuild from sg101/scss/
      # and fail if the result differs from what is committed.
      #
      # It catches both directions of the mistake -- a Sass change committed
      # without its rebuild, and a hand-edit to main.min.css that the next
      # rebuild would silently discard.
      #
      # `npm ci` rather than `npm install`, because the whole point of the
      # committed lockfile is that CI resolves the same dart-sass, autoprefixer
      # and cssnano a developer did. It also pins caniuse-lite, which is what
      # browserslist consults: an unpinned one would change the emitted vendor
      # prefixes on its own schedule and fail this step on a day nobody touched
      # the CSS.
      #
      # Node lives only here and on developer machines. The application image
      # has none, and deploys do not build CSS.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: The committed stylesheet rebuilds to itself
        working-directory: sg101
        run: |
          set -eux
          npm ci
          npm run build:css
          # --exit-code makes a difference a failure. Without it this step would
          # print the diff and pass, which is the shape of check that looks like
          # coverage and is not.
          git diff --exit-code -- static/css/v3/main.min.css

      # docker-compose loads .env via env_file, exactly like a fresh dev
      # checkout; seed it from the committed example (a dummy SECRET_KEY and the
      # throwaway credentials the `postgres` service initializes itself with, so
      # no real secrets are needed).
      - name: Seed .env from the example
        run: cp .env.example .env

      - name: Build the image
        run: docker compose build web

      # Every app has migrations now, so this gate finally covers the whole
      # project. It used to be checking 5 apps out of 26 without saying so: a
      # blanket makemigrations skips apps that have no migrations package, and
      # 21 of them didn't, so their models could drift from the schema
      # unnoticed.
      - name: Check for missing migrations
        run: >
          docker compose run --rm web
          python manage.py makemigrations --check --dry-run
          --settings=sg101.settings.docker_test

      # docker_test settings: PostgreSQL + Redis over TCP, both started via
      # web's depends_on (and Postgres waited on by its healthcheck). The suite
      # runs on the engine the site runs on, so engine-specific behavior --
      # full-text search above all -- is actually covered. Measure coverage and
      # print a summary.
      #
      # --noinput because a leftover test database makes Django prompt before
      # dropping it, and a prompt with no terminal is an EOFError, not a wait.
      # The suite runs under the deprecation gate: warnings promoted to errors,
      # so a deprecation introduced between Django upgrades fails here rather
      # than waiting for someone to run the gate by hand at the next rung. That
      # gap is what this closes -- CI has always run the suite and never the
      # gate.
      #
      # The filter list comes from tools/deprecation_gate.sh so CI and a
      # developer use one source; see that file for why it is PYTHONWARNINGS
      # rather than -W, and why the ignores are spelled by message.
      #
      # -e passes it INTO the container. A workflow-level `env:` block would set
      # it on the runner, where the suite does not run, and an unbound gate looks
      # exactly like a passing one.
      - name: Run test suite with coverage, under the deprecation gate
        run: >
          docker compose run --rm
          -e PYTHONWARNINGS="$(tools/deprecation_gate.sh)"
          web
          sh -c "coverage run --source='.' manage.py test --noinput --settings=sg101.settings.docker_test
          && coverage report
          && coverage xml"

      # The one thing a Mac cannot answer. Docker Desktop translates bind-mount
      # ownership, so the production image passes there whatever UID it runs as
      # -- and the VM does not translate anything. This runner is real Linux
      # with real bind-mount semantics, which is the only place the contract
      # between the image's UID and the host directories' owner is actually
      # tested before the VM exists.
      #
      # It builds the prod target (the suite above builds dev, which is root on
      # purpose), checks the processes are not root, and checks that a directory
      # owned by the matching UID is writable and one owned by another is not --
      # because a test that only proves "it wrote" would pass on a world-writable
      # directory and prove nothing.
      - name: The production image runs unprivileged, and its UID is the contract
        run: |
          set -eux
          docker build --target prod -t sg101-uid-check .

          test "$(docker run --rm sg101-uid-check id -u)" = 1000
          test "$(docker run --rm sg101-uid-check id -un)" = sg101

          mkdir -p /tmp/uidcheck/ok /tmp/uidcheck/wrong
          sudo chown 1000:1000 /tmp/uidcheck/ok
          sudo chown 65534:65534 /tmp/uidcheck/wrong
          sudo chmod 755 /tmp/uidcheck/ok /tmp/uidcheck/wrong

          docker run --rm -v /tmp/uidcheck/ok:/m sg101-uid-check \
              sh -c 'touch /m/probe && echo "matching UID: writable"'

          if docker run --rm -v /tmp/uidcheck/wrong:/m sg101-uid-check \
                 sh -c 'touch /m/probe' 2>/dev/null; then
            echo "a directory owned by another UID was writable; the check proves nothing"
            exit 1
          fi
          echo "non-matching UID: refused, as it must be"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v
