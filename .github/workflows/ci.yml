name: CI

# Runs the existing test suite on every push/PR to the modernization branch,
# using the SAME Docker image and services as local dev (Python 3.12 /
# PostgreSQL 16) for parity -- the `postgres` service comes from
# docker-compose.yml rather than a GitHub-hosted service container, so CI and a
# developer's laptop run the identical database.
# `main` intentionally has no CI: it's preserved legacy history and predates the
# Docker/CI setup, which live only on `modernize`.
on:
  push:
    branches: [modernize]
  pull_request:
    branches: [modernize]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # docker-compose loads .env via env_file, exactly like a fresh dev
      # checkout; seed it from the committed example (a dummy SECRET_KEY and the
      # throwaway credentials the `postgres` service initializes itself with, so
      # no real secrets are needed).
      - name: Seed .env from the example
        run: cp .env.example .env

      - name: Build the image
        run: docker compose build web

      # Every app has migrations now, so this gate finally covers the whole
      # project. It used to be checking 5 apps out of 26 without saying so: a
      # blanket makemigrations skips apps that have no migrations package, and
      # 21 of them didn't, so their models could drift from the schema
      # unnoticed.
      - name: Check for missing migrations
        run: >
          docker compose run --rm web
          python manage.py makemigrations --check --dry-run
          --settings=sg101.settings.docker_test

      # docker_test settings: PostgreSQL + Redis over TCP, both started via
      # web's depends_on (and Postgres waited on by its healthcheck). The suite
      # runs on the engine the site runs on, so engine-specific behavior --
      # full-text search above all -- is actually covered. Measure coverage and
      # print a summary.
      #
      # --noinput because a leftover test database makes Django prompt before
      # dropping it, and a prompt with no terminal is an EOFError, not a wait.
      # The suite runs under the deprecation gate: warnings promoted to errors,
      # so a deprecation introduced between Django upgrades fails here rather
      # than waiting for someone to run the gate by hand at the next rung. That
      # gap is what this closes -- CI has always run the suite and never the
      # gate.
      #
      # The filter list comes from tools/deprecation_gate.sh so CI and a
      # developer use one source; see that file for why it is PYTHONWARNINGS
      # rather than -W, and why the ignores are spelled by message.
      #
      # -e passes it INTO the container. A workflow-level `env:` block would set
      # it on the runner, where the suite does not run, and an unbound gate looks
      # exactly like a passing one.
      - name: Run test suite with coverage, under the deprecation gate
        run: >
          docker compose run --rm
          -e PYTHONWARNINGS="$(tools/deprecation_gate.sh)"
          web
          sh -c "coverage run --source='.' manage.py test --noinput --settings=sg101.settings.docker_test
          && coverage report
          && coverage xml"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v
