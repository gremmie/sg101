# surfguitar101.com: TLS, a few files served from disk, and everything else
# proxied to gunicorn in the `web` container.
#
# Paths under /srv and /etc/apache2/tls are bind mounts; docker-compose.prod.yml
# says where each one comes from on the host.

<VirtualHost *:80>
   ServerName surfguitar101.com
   ServerAlias www.surfguitar101.com
   Redirect permanent "/" "https://surfguitar101.com/"
</VirtualHost>

<VirtualHost *:443>
   ServerName surfguitar101.com
   ServerAlias www.surfguitar101.com
   UseCanonicalName Off
   ServerAdmin admin@surfguitar101.com

   LogLevel warn
   ErrorLog ${APACHE_LOG_DIR}/error.log
   # The container's own health check comes from inside it, every 30 seconds;
   # keep it out of the log fail2ban reads.
   SetEnvIf Remote_Addr "^127\.0\.0\.1$" healthcheck
   CustomLog ${APACHE_LOG_DIR}/access.log combined env=!healthcheck

   # Only Cloudflare connects here, so the distro's protocol and cipher
   # defaults stand rather than a hand-kept list.
   SSLEngine on
   SSLCertificateFile /etc/apache2/tls/origin.pem
   SSLCertificateKeyFile /etc/apache2/tls/origin.key

   # No Strict-Transport-Security here: Django sends it, and a second copy
   # from the proxy would be a second value to keep in step.

   RewriteEngine on

   # Maintenance: while /srv/maintenance/on exists, every request gets the
   # offline page with a 503, whether or not gunicorn is running. Toggled on
   # the host with `touch var/maintenance/on` and `rm`; no reload needed.
   RewriteCond /srv/maintenance/on -f
   RewriteCond %{REQUEST_URI} !=/offline.html
   RewriteRule ^ - [R=503,L]
   ErrorDocument 503 /offline.html
   Alias /offline.html /srv/sg101/templates/offline.html

   # Rewrite old SG101 1.0 URLs of interest
   RewriteCond %{QUERY_STRING} ^name=Forums&file=viewtopic&t=(\d+)
   RewriteRule ^/modules\.php /forums/topic/%1/? [R=301,L]

   RewriteCond %{QUERY_STRING} ^name=Forums&file=viewtopic&p=(\d+)
   RewriteRule ^/modules\.php /forums/post/%1/? [R=301,L]

   RewriteCond %{QUERY_STRING} sid=([0-9]+)
   RewriteRule ^/modules\.php /news/story/%1/? [R=301,L]

   RewriteRule ^/modules/Podcast/feeds/feed2?.xml /podcast/feed.xml/ [R=301,L]

   RewriteRule ^/convention https://www.facebook.com/SG101Convention [R=301,L]

   # Served from disk. Static files are not in this list: WhiteNoise serves
   # them from the application, under their hashed names. These three are
   # the exceptions that have to answer at the site root.
   Alias /media/ /srv/sg101/media/
   Alias /favicon.ico /srv/sg101/static/favicon.ico
   Alias /robots.txt /srv/sg101/static/robots.txt
   Alias /google1974c4ddc5b1ff40.html /srv/sg101/static/google1974c4ddc5b1ff40.html
   # Not in the repository: content that lived in the old host's document
   # root, copied to var/public at cutover.
   Alias /hosted/ /srv/public/hosted/
   Alias /photos/ /srv/public/photos/

   <Directory /srv>
      Options -Indexes +FollowSymLinks -MultiViews
      AllowOverride None
      Require all granted
   </Directory>

   # A URL under /media never changes what it holds, because nothing reuses a
   # name: avatars carry a microsecond stamp (bio/models.py), downloads and
   # potd sit under dated directories, and Django's storage suffixes a name
   # that would collide. So a year is not optimistic, it is the actual
   # lifetime of the bytes.
   <Directory /srv/sg101/media>
      ExpiresActive On
      ExpiresDefault "access plus 1 year"
      Header append Cache-Control public
   </Directory>

   # The podcast is the one exception, and it is not Django-managed: episode
   # audio is referenced by podcast.Item.enclosure_url, a URLField, and the
   # files are placed on disk by hand -- so sg101_episodeNN.m4a can be replaced
   # where it stands. A month bounds how long a corrected episode could serve
   # stale; republishing one wants an edge purge as well.
   <Directory /srv/sg101/media/podcast>
      ExpiresDefault "access plus 1 month"
   </Directory>

   # Everything not served above goes to gunicorn. The exclusions come first,
   # since the first matching ProxyPass wins.
   ProxyPass /offline.html !
   ProxyPass /media/ !
   ProxyPass /favicon.ico !
   ProxyPass /robots.txt !
   ProxyPass /google1974c4ddc5b1ff40.html !
   ProxyPass /hosted/ !
   ProxyPass /photos/ !
   ProxyPass / http://web:8000/
   ProxyPassReverse / http://web:8000/
   ProxyPreserveHost On

   # Set, never passed through: Django trusts this header to decide a request
   # was secure, so a client must not be able to supply it.
   RequestHeader set X-Forwarded-Proto "https"

   # Same discipline, for who the client is. mod_remoteip has already decided
   # that -- CF-Connecting-IP from a Cloudflare address, the peer otherwise --
   # but the application is a separate process now, not mod_wsgi inside this
   # server, so it would otherwise see this proxy as the client. REMOTE_ADDR
   # here is mod_remoteip's answer; CONN_REMOTE_ADDR would be the raw peer.
   RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
</VirtualHost>
