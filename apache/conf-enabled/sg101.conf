# Server-wide settings. The distro's security.conf is still read first; these
# follow it and win.

# The name Apache uses for itself; without it every start warns that it
# could not work one out.
ServerName surfguitar101.com

# Name no version or OS in the Server header or on error pages.
ServerTokens Prod
ServerSignature Off

# Set rather than inherited: the files served directly (media, the root files,
# /hosted and /photos) sit on bind mounts over the container's overlay
# filesystem, where the default is worth not guessing at.
EnableSendfile On
