# The real client address, behind Cloudflare.
#
# Every connection to this server comes from Cloudflare, so REMOTE_ADDR is a
# Cloudflare edge address unless something replaces it. Six applications read
# REMOTE_ADDR to record who did what -- registrations, failed logins, forum
# posts, comments, downloads, donations -- and fail2ban bans on the addresses
# in the vhost's access log. All of it names the edge without this file.
#
# THE TRUSTED LIST IS THE SECURITY BOUNDARY, NOT THE HEADER NAME.
# CF-Connecting-IP is an ordinary request header that any client can send. It is
# believed only on connections from the addresses named below; from anywhere
# else it is ignored and the peer address stands. Widen this list and anyone
# inside it can claim to be anyone.
#
# Both address families are listed. IPv4 alone would leave every visitor
# arriving over IPv6 recorded as the edge that relayed them -- the failure that
# still looks like it is working.
#
# The ranges are in ../cloudflare-ranges.txt, not here, because the origin
# firewall reads the same file: one list, so the addresses Apache believes and
# the addresses allowed to connect cannot drift apart. Its header says where the
# ranges come from, when they were last verified, and how to check them.

RemoteIPHeader CF-Connecting-IP

# Relative to ServerRoot, /etc/apache2, where this directory is mounted as sg101/.
RemoteIPTrustedProxyList sg101/cloudflare-ranges.txt
