{% load core_tags %}
<form action="." method="post">{% csrf_token %}
<fieldset>
<legend>{{ legend_text }}</legend>
{{ form.as_p }}
{% comment_dialogs %}
<input type="submit" value="{{ submit_value }}" {% if is_ajax %}id="forums-reply-post"{% endif %} />

<br />
<br />
<div id="attachment">
{% if post_id %}<input type="hidden" name="post_id" value="{{ post_id }}" />{% endif %}
</div>

</fieldset>
</form>
